version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: filemind-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:alpine
    container_name: filemind-redis
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: filemind-server
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/filemind
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=filemind_super_secret_jwt_key_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
      - redis

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: filemind-worker
    command: npm run worker
    environment:
      - MONGO_URI=mongodb://mongodb:27017/filemind
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: filemind-client
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo-data:
